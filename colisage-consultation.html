<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulter le colisage — PIGVS</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0B2C5C" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
    .search-box { position:relative; margin-bottom:14px; }
    .search-box input { width:100%; padding:13px 40px 13px 14px; font-size:16px;
      border-radius:10px; border:1px solid #ccc; box-sizing:border-box; }
    .search-box .clear { position:absolute; right:10px; top:50%;
      transform:translateY(-50%); border:none; background:transparent;
      font-size:20px; color:#8a94a1; cursor:pointer; display:none; }

    .breadcrumb { font-size:14px; color:#5a6673; margin:4px 0 14px;
      display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
    .breadcrumb a { color:#0078D7; text-decoration:none; font-weight:600; cursor:pointer; }
    .breadcrumb .sep { color:#b8c0cc; }

    .cards { display:flex; flex-direction:column; gap:10px; }

    .cont-card { display:flex; align-items:center; gap:14px; padding:16px;
      border-radius:12px; border:1px solid #e0e0e0; background:#fff;
      cursor:pointer; text-align:left; width:100%; }
    .cont-card:active { transform:scale(.99); }
    .pastille { width:20px; height:44px; border-radius:6px; flex:0 0 auto; }
    .cont-card .txt { flex:1; }
    .cont-card .titre { font-size:17px; font-weight:700; }
    .cont-card .sous { font-size:13px; color:#5a6673; margin-top:2px; }
    .cont-card .chev { color:#b8c0cc; font-size:22px; }
    .cont-card .compte { font-size:12px; color:#8a94a1; }

    .caisse-card { display:flex; align-items:center; gap:12px; padding:14px;
      border-radius:12px; border:1px solid #e0e0e0; background:#fff;
      cursor:pointer; width:100%; text-align:left; }
    .caisse-card .ico { font-size:24px; }
    .caisse-card .txt { flex:1; min-width:0; }
    .caisse-card .titre { font-weight:700; font-size:16px; }
    .caisse-card .compte { font-size:12px; color:#8a94a1; }
    .caisse-card .chev { color:#b8c0cc; font-size:22px; }

    /* ---------- Etat de validation ---------- */
    .valide-tag { display:inline-flex; align-items:center; gap:5px;
      font-size:11.5px; font-weight:700; border-radius:999px;
      padding:2px 9px; margin-top:4px; }
    .valide-tag.ok     { background:#e7f6ec; color:#14683a; border:1px solid #bfe6cd; }
    .valide-tag.ancien { background:#fff8e1; color:#8a6100; border:1px solid #ffe0a3; }
    .valide-tag.jamais { background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0; }

    .bandeau-validation {
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      border-radius:12px; padding:12px 14px; margin-bottom:14px;
      font-size:13.5px; }
    .bandeau-validation.ok     { background:#e7f6ec; border:1px solid #bfe6cd; color:#14683a; }
    .bandeau-validation.ancien { background:#fff8e1; border:1px solid #ffe0a3; color:#8a6100; }
    .bandeau-validation.jamais { background:#f1f5f9; border:1px solid #e2e8f0; color:#475569; }
    .bandeau-validation .ico { font-size:20px; }
    .bandeau-validation .det { flex:1; min-width:150px; }
    .bandeau-validation b { font-weight:800; }

    .section-titre { display:flex; align-items:center; gap:10px;
      margin:18px 0 8px; font-weight:700; color:#334; }

    .item-list { list-style:none; padding:0; margin:0; }
    .item-list li { padding:12px 14px; border-bottom:1px solid #eef0f3;
      font-size:15px; display:flex; gap:10px; }
    .item-list li:before { content:"\1F527"; }

    .result { background:#fff; border:1px solid #e0e0e0; border-radius:12px;
      padding:12px 14px; margin-bottom:10px; width:100%;
      text-align:left; cursor:pointer; display:block; }
    .result:active { transform:scale(.995); }
    .result .item { font-weight:700; font-size:15px; }

    .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 10px;
      border-radius:14px; font-size:12px; font-weight:700; color:#fff; }
    .chip .dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.9); }

    .loc { font-size:13px; color:#5a6673; margin-top:4px;
      display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .loc .caisse { background:#eef4fb; color:#083f78; padding:3px 10px;
      border-radius:14px; font-weight:700; }

    .vide { text-align:center; color:#8a94a1; padding:30px 10px; }

    .res-caisse { border-left:4px solid #0078D7; }
    .res-caisse .apercu { font-size:12px; color:#8a94a1; margin-top:5px; line-height:1.45; }

    .badge-approx { display:inline-block; background:#fff4e0; color:#95610a;
      border:1px solid #f3d7a4; font-size:11px; font-weight:700;
      padding:1px 7px; border-radius:10px; margin-left:6px; vertical-align:2px; }

    mark { background:#fff2a8; color:inherit; padding:0 1px; border-radius:3px; }

    .sous-titre-inline { font-size:12px; color:#8a94a1; font-weight:400; margin-left:auto; }

    .btn-saisir { display:flex; align-items:center; justify-content:space-between;
      gap:10px; width:100%; min-height:52px; padding:13px 16px; margin-bottom:12px;
      font-size:15.5px; font-weight:700; text-decoration:none;
      background:var(--primary,#0078D7); color:#fff; border:0; border-radius:12px; }

    .btn-retour-conteneur {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--marine, #0B2C5C);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .btn-retour-conteneur:active { opacity: .8; }

    .maj-info { font-size:11.5px; color:#8a94a1; text-align:center; margin-top:18px; }
    </style>
    <script src="pigvs-auth.js"></script>
    <script>
      PIGVS_AUTH.protegerPage();
    </script>
  </head>
  <body>
    <header class="app-header">
      <a class="back" href="colisage.html" id="backLink">‹</a>
      <h1>🔍 Consulter le colisage</h1>
    </header>

    <div class="container">
      <div class="search-box">
        <input
          type="text"
          id="search"
          placeholder="🔍 Rechercher (ex : BOX 40, SPICE, sécheur, L23…)"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button class="clear" id="clearBtn">×</button>
      </div>

      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="contenu"></div>
      <div class="maj-info" id="majInfo"></div>
    </div>

    <script src="pigvs-colisage.js"></script>
    <script>
let DATA = { conteneurs: [] };

const contenu     = document.getElementById('contenu');
const breadcrumb  = document.getElementById('breadcrumb');
const searchInput = document.getElementById('search');
const clearBtn    = document.getElementById('clearBtn');

let vue = { conteneurId:null, caisseIdx:null };

/* Au-dela de ce delai, la validation est consideree comme ancienne */
const JOURS_FRAIS = 120;

function normalize(s){
  return (s||'').toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function cleKey(s){ return normalize(s).replace(/[^a-z0-9]/g,''); }
function eclater(s){
  return normalize(s).replace(/([a-z])(\d)/g,'$1 $2').replace(/(\d)([a-z])/g,'$1 $2');
}
function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ======================================================================
   RETOUR AU CONTENEUR D'ORIGINE
   ----------------------------------------------------------------------
   ATTENTION : cette CONSTANTE doit garder un nom different de la
   FONCTION de navigation retourConteneur() definie plus bas, sinon
   JavaScript leve "Identifier has already been declared" et TOUT
   le script s'arrete (recherche morte, page vide...).
   ====================================================================== */
const paramsInit = new URLSearchParams(location.search);
const retourConteneurParam = paramsInit.get("retourConteneur");

if (retourConteneurParam) {
  const bandeau = document.createElement("a");
  bandeau.className = "btn-retour-conteneur";
  bandeau.href =
    "colisage-conteneur-saisie.html?conteneur=" +
    encodeURIComponent(retourConteneurParam);
  bandeau.innerHTML =
    "← Retour au conteneur « " + esc(retourConteneurParam) + " »";

  document
    .querySelector(".container")
    .insertBefore(bandeau, document.querySelector(".search-box"));
}

/* ======================================================================
   ETAT DE VALIDATION D'UNE CAISSE
   ====================================================================== */
function etatValidation(caisse){
  const v = caisse && (caisse.verif || caisse.derniereValidation);
  if(!v || !v.date) return { classe:'jamais', court:'Jamais validée', long:null };

  let jours = null;
  const d = new Date(v.date);
  if(!isNaN(d)) jours = Math.floor((Date.now() - d.getTime()) / 86400000);

  const dateAff = /^\d{4}-\d{2}-\d{2}/.test(v.date)
    ? new Date(v.date).toLocaleDateString('fr-FR')
    : v.date;

  const ancien = jours !== null && jours > JOURS_FRAIS;
  const classe = ancien ? 'ancien' : 'ok';

  let court = '✓ ' + dateAff;
  if(v.site) court += ' · ' + v.site;

  let long = 'Colisage validé le <b>' + esc(dateAff) + '</b>';
  if(v.site) long += ' sur <b>' + esc(v.site) + '</b>';
  if(v.operateur) long += ' · relevé par ' + esc(v.operateur);
  if(v.valideur) long += ' · validé par ' + esc(v.valideur);
  if(jours !== null){
    long += jours === 0 ? " · aujourd'hui"
          : jours === 1 ? ' · hier'
          : ' · il y a ' + jours + ' jours';
  }

  return { classe:classe, court:court, long:long, jours:jours };
}

function tagValidation(caisse){
  const e = etatValidation(caisse);
  const ico = e.classe === 'ok' ? '🟢' : e.classe === 'ancien' ? '🟠' : '⚪';
  return '<span class="valide-tag ' + e.classe + '">' + ico + ' ' + esc(e.court) + '</span>';
}

/* ======================================================================
   MOTEUR DE RECHERCHE
   ====================================================================== */
function editDistance(a,b){
  const dp=[]; for(let i=0;i<=a.length;i++){dp[i]=[];dp[i][0]=i;} for(let j=0;j<=b.length;j++){dp[0][j]=j;}
  for(let i=1;i<=a.length;i++){for(let j=1;j<=b.length;j++){
    const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])dp[i][j]=Math.min(dp[i][j],dp[i-2][j-2]+1);
  }} return dp[a.length][b.length];
}
function wordScore(s,t){
  if(!s)return 1; if(t===s)return 120; if(t.startsWith(s))return 100; if(t.includes(s))return 80;
  const tp=t.substring(0,s.length); const d=Math.min(editDistance(s,t),editDistance(s,tp));
  let th=0; if(s.length<=3)th=0; else if(s.length<=5)th=1; else if(s.length<=9)th=2; else th=3;
  return d<=th?60-d*10:0;
}
function scoreMots(q,text){
  const qw=q.split(/\s+/).filter(Boolean),tw=text.split(/\s+/).filter(Boolean);
  if(!qw.length)return 1; let tot=0;
  for(const w of qw){let b=0;for(const t of tw){const sc=wordScore(w,t);if(sc>b)b=sc;}
  if(b===0)return 0;tot+=b;}
  if(text.startsWith(q))tot+=50; if(text.includes(q))tot+=30; return tot;
}
function itemScore(search, texte){
  const q = normalize(search);
  if(!q) return 1;
  const kq = cleKey(search), kt = cleKey(texte);
  if(kq){
    if(kt === kq)          return 200;
    if(kt.startsWith(kq))  return 170;
    if(kt.includes(kq))    return 150;
  }
  const score = scoreMots(q, normalize(texte));
  if(score > 0) return score;
  return scoreMots(eclater(search), eclater(texte));
}
function estApproximatif(search,texte){
  const kq = cleKey(search), kt = cleKey(texte);
  if(kq && kt.includes(kq)) return false;
  const t = normalize(texte);
  return !normalize(search).split(/\s+/).filter(Boolean).every(w=>t.includes(w));
}
function surligner(texte,search){
  const mots = normalize(search).split(/\s+/).filter(Boolean);
  const brut = normalize(texte);
  const marques = new Array(texte.length).fill(false);
  mots.forEach(w=>{
    let i = brut.indexOf(w);
    while(i>=0){ for(let k=i;k<i+w.length&&k<marques.length;k++) marques[k]=true; i=brut.indexOf(w,i+w.length); }
  });
  if(!marques.some(Boolean)){
    const kq = cleKey(search);
    if(kq){
      const map = []; let kt = '';
      for(let i=0;i<texte.length;i++){
        const c = normalize(texte[i]).replace(/[^a-z0-9]/g,'');
        if(c){ kt += c; map.push(i); }
      }
      const pos = kt.indexOf(kq);
      if(pos >= 0){
        for(let k=pos;k<pos+kq.length&&k<map.length;k++) marques[map[k]] = true;
      }
    }
  }
  let out='', ouvert=false;
  for(let i=0;i<texte.length;i++){
    if(marques[i]&&!ouvert){ out+='<mark>'; ouvert=true; }
    if(!marques[i]&&ouvert){ out+='</mark>'; ouvert=false; }
    out += esc(texte[i]);
  }
  return out + (ouvert?'</mark>':'');
}

/* ======================================================================
   CHARGEMENT
   ====================================================================== */
PIGVS_COLISAGE.lireColisage()
  .then(function (d) {
    DATA = d || {};
    DATA.conteneurs = Array.isArray(DATA.conteneurs) ? DATA.conteneurs : [];

    DATA.conteneurs.forEach(function (conteneur, indexConteneur) {
      if (!conteneur.id) {
        conteneur.id = "conteneur-" + indexConteneur + "-" + cleKey(conteneur.nom || "");
      }

      conteneur.caisses = Array.isArray(conteneur.caisses) ? conteneur.caisses : [];

      conteneur.caisses = conteneur.caisses.filter(function (caisse) {
        return caisse &&
               typeof caisse === "object" &&
               String(caisse.nom || "").trim() !== "";
      });

      conteneur.caisses.forEach(function (caisse) {
        caisse.items = Array.isArray(caisse.items) ? caisse.items : [];
      });
    });

    console.log("PIGVS consultation :", DATA.conteneurs.length, "conteneur(s) chargés");

    afficherMaj();
    ouvertureDirecte();
    render();
  })
  .catch(function (err) {
    console.error("Erreur consultation colisage :", err);
    breadcrumb.innerHTML = "";
    contenu.innerHTML =
      "<div class='vide'>" +
        "⚠️ Impossible d'afficher le colisage.<br>" +
        "<span style='font-size:13px'>" +
          esc(err && err.message ? err.message : "Erreur inconnue") +
        "</span>" +
      "</div>";
  });

function afficherMaj(){
  const nb = (DATA.conteneurs||[]).reduce((s,c)=>s+(c.caisses||[]).length,0);
  let valides = 0;
  (DATA.conteneurs||[]).forEach(c=>(c.caisses||[]).forEach(k=>{
    const v = k.verif || k.derniereValidation;
    if(v && v.date) valides++;
  }));
  const el = document.getElementById('majInfo');
  if(el){
    el.textContent = nb + ' caisses · ' + valides + ' validée(s) sur le terrain · source : ' +
      (DATA._source === 'flux' ? 'SharePoint' : 'fichier local');
  }
}

/* ---------- Ouverture directe (scanner ou lien depuis un conteneur) ---------- */
function ouvertureDirecte() {
  const p = new URLSearchParams(location.search);
  const caisseDemandee = p.get("caisse");
  const conteneurDemande = p.get("conteneur");

  if (caisseDemandee) {
    const rechCaisse = cleKey(caisseDemandee);
    let conteneursAParcourir = DATA.conteneurs || [];

    /* Si le conteneur est fourni, on cherche d'abord uniquement dedans. */
    if (conteneurDemande) {
      const rechConteneur = cleKey(conteneurDemande);
      const cible = conteneursAParcourir.find(function (c) {
        return cleKey(c.nom) === rechConteneur ||
               cleKey(c.id) === rechConteneur ||
               cleKey(c.ref || "") === rechConteneur;
      });
      if (cible) {
        conteneursAParcourir = [cible];
      }
    }

    for (const c of conteneursAParcourir) {
      const idx = (c.caisses || []).findIndex(function (k) {
        return cleKey(k.nom) === rechCaisse;
      });
      if (idx >= 0) {
        vue = { conteneurId: c.id, caisseIdx: idx };
        searchInput.value = "";
        clearBtn.style.display = "none";
        return;
      }
    }

    /* Deuxieme recherche globale si le conteneur fourni ne correspond pas. */
    for (const c of DATA.conteneurs || []) {
      const idx = (c.caisses || []).findIndex(function (k) {
        return cleKey(k.nom) === rechCaisse;
      });
      if (idx >= 0) {
        vue = { conteneurId: c.id, caisseIdx: idx };
        searchInput.value = "";
        clearBtn.style.display = "none";
        return;
      }
    }

    searchInput.value = caisseDemandee;
    clearBtn.style.display = "block";
    return;
  }

  if (conteneurDemande) {
    const rech = cleKey(conteneurDemande);
    const c = (DATA.conteneurs || []).find(function (x) {
      return cleKey(x.nom) === rech ||
             cleKey(x.id) === rech ||
             cleKey(x.ref || "") === rech;
    });
    if (c) {
      vue = { conteneurId: c.id, caisseIdx: null };
      return;
    }
    searchInput.value = conteneurDemande;
    clearBtn.style.display = "block";
  }
}

/* ---------- Recherche ---------- */
searchInput.addEventListener('input', ()=>{
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value=''; clearBtn.style.display='none'; render(); searchInput.focus();
});

/* ---------- Rendu ---------- */
function render(){
  const q = searchInput.value.trim();
  if(q){ renderRecherche(q); return; }
  if(vue.conteneurId===null){ renderConteneurs(); }
  else if(vue.caisseIdx===null){ renderCaisses(); }
  else { renderItems(); }
}

function renderConteneurs(){
  breadcrumb.innerHTML = "<span>Tous les conteneurs</span>";
  const groupes = {};
  (DATA.conteneurs || []).forEach(function (c) {
    (groupes[c.categorie] = groupes[c.categorie]||[]).push(c);
  });

  let html = "";
  Object.keys(groupes).forEach(cat=>{
    html += `<div class="section-titre">${cat==='ETV'?'🚚':'🧰'} Conteneurs ${cat}</div><div class="cards">`;
    groupes[cat].forEach(c=>{
      const nbItems = (c.caisses || []).reduce(function (total, caisse) {
        return total + (Array.isArray(caisse.items) ? caisse.items.length : 0);
      }, 0);

      const nbVal = (c.caisses || []).filter(function (caisse) {
        const validation = caisse.verif || caisse.derniereValidation;
        return validation && validation.date;
      }).length;

      html += `<button class="cont-card" onclick="ouvrirConteneur('${c.id}')">
        <div class="pastille" style="background:${c.couleur}"></div>
        <div class="txt">
          <div class="titre">${esc(c.nom)} <span class="compte">· ${esc(c.couleurNom||'')}</span></div>
          <div class="sous">${esc(c.ref||'')}</div>
          <div class="compte">${(c.caisses||[]).length} caisses · ${nbItems} éléments${nbVal? ' · '+nbVal+' validée(s)':''}</div>
        </div>
        <div class="chev">›</div>
      </button>`;
    });
    html += `</div>`;
  });
  contenu.innerHTML = html;
}

function renderCaisses(){
  const c = (DATA.conteneurs||[]).find(x=>x.id===vue.conteneurId);
  if(!c){ retourAccueil(); return; }

  breadcrumb.innerHTML =
    `<a onclick="retourAccueil()">Conteneurs</a><span class="sep">›</span><span>${esc(c.nom)}</span>`;

  let html = `<div class="section-titre"><span class="chip" style="background:${c.couleur}"><span class="dot"></span>${esc(c.nom)}</span> <span style="font-weight:400;color:#5a6673">${esc(c.ref||'')}</span></div><div class="cards">`;

  (c.caisses||[]).forEach((k,idx)=>{
    html += `<button class="caisse-card" onclick="ouvrirCaisse(${idx})">
      <div class="ico">📦</div>
      <div class="txt">
        <div class="titre">${esc(k.nom)}</div>
        ${tagValidation(k)}
      </div>
      <div class="compte">${(k.items||[]).length} él.</div>
      <div class="chev">›</div>
    </button>`;
  });
  html += `</div>`;
  contenu.innerHTML = html;
}

function libelleItem(it){
  if(it && typeof it === "object"){
    const nom = it.equipement || it.nom || "";
    const q = it.quantite || it.quantitePresente || 1;
    return q > 1 ? nom + " ×" + q : nom;
  }
  return String(it || "");
}

function renderItems(){
  const c = (DATA.conteneurs||[]).find(x=>x.id===vue.conteneurId);
  if(!c){ retourAccueil(); return; }
  const k = (c.caisses||[])[vue.caisseIdx];
  if(!k){ retourConteneur(); return; }

  breadcrumb.innerHTML =
    `<a onclick="retourAccueil()">Conteneurs</a><span class="sep">›</span>` +
    `<a onclick="retourConteneur()">${esc(c.nom)}</a><span class="sep">›</span>` +
    `<span>${esc(k.nom)}</span>`;

  const e = etatValidation(k);
  const ico = e.classe === 'ok' ? '🟢' : e.classe === 'ancien' ? '🟠' : '⚪';
  const texte = e.long
    ? e.long
    : "Cette caisse n'a jamais fait l'objet d'un colisage validé.";
  const conseil = e.classe === 'ancien'
    ? "<br><span style='font-size:12.5px'>Contenu potentiellement obsolète : un nouveau relevé serait utile.</span>"
    : (e.classe === 'jamais'
      ? "<br><span style='font-size:12.5px'>Le contenu affiché est celui du colisage théorique.</span>"
      : "");

  let html = `<div class="bandeau-validation ${e.classe}">
      <span class="ico">${ico}</span>
      <div class="det">${texte}${conseil}</div>
    </div>`;

  /* Si on vient d'un conteneur, on transmet le contexte a la page
     de saisie pour qu'elle propose elle aussi un retour rapide. */
  const paramRetour = retourConteneurParam
    ? "&retourConteneur=" + encodeURIComponent(retourConteneurParam)
    : "";

  html += `<a class="btn-saisir" href="colisage-saisie.html?caisse=${encodeURIComponent(k.nom)}${paramRetour}">
      <span>📝 Renseigner le colisage de cette caisse</span><span>›</span></a>`;

  html += `<div class="section-titre">📦 ${esc(k.nom)}<span class="sous-titre-inline">${esc(c.nom)} · ${esc(c.ref||'')}</span></div>`;

  if((k.items||[]).length){
    html += `<ul class="item-list">`;
    k.items.forEach(it=> html += `<li>${esc(libelleItem(it))}</li>`);
    html += `</ul>`;
  } else {
    html += `<div class='vide'>Cette caisse ne contient aucun élément référencé.</div>`;
  }

  contenu.innerHTML = html;
}

/* ---------- Recherche ---------- */
function renderRecherche(saisie){
  breadcrumb.innerHTML = `<span>Résultats pour « ${esc(saisie)} »</span>`;
  const caisses = [], items = [];

  (DATA.conteneurs || []).forEach(function (c) {
    const scoreCont = Math.max(
      itemScore(saisie, c.nom || ""),
      itemScore(saisie, c.ref || "")
    );

    (c.caisses || []).forEach(function (k, idx) {
      const scoreNom = itemScore(saisie, k.nom || "");
      if(scoreNom > 0 || scoreCont > 0){
        caisses.push({ conteneur:c, caisse:k, idx,
          score: scoreNom>0 ? scoreNom + 40 : scoreCont,
          parConteneur: scoreNom===0 });
      }

      (k.items || []).forEach(function (it) {
        const texteItem = libelleItem(it);
        const sc = itemScore(saisie, texteItem);
        if (sc > 0) {
          items.push({
            item: texteItem,
            conteneur: c,
            caisse: k,
            nomCaisse: k.nom || "",
            idx: idx,
            score: sc
          });
        }
      });
    });
  });

  caisses.sort((a,b)=> b.score-a.score || a.caisse.nom.localeCompare(b.caisse.nom));
  items.sort((a,b)=> b.score-a.score || a.item.localeCompare(b.item));

  if(!caisses.length && !items.length){
    contenu.innerHTML = "<div class='vide'>Aucun résultat 🔍<br><span style='font-size:13px'>Essayez un mot plus court ou une autre orthographe.</span></div>";
    return;
  }

  let html = '';

  if(caisses.length){
    html += `<div class="section-titre">🧰 Caisses &amp; sous-ensembles<span class="sous-titre-inline">${caisses.length}</span></div>`;
    caisses.slice(0,40).forEach(r=>{
      const listeItems = r.caisse.items || [];
      const apercu = listeItems.slice(0,4).map(function(it){ return esc(libelleItem(it)); }).join(' · ')
             + (listeItems.length>4 ? ` … +${listeItems.length-4}` : '');
      const approx = !r.parConteneur && estApproximatif(saisie, r.caisse.nom);
      html += `<button class="result res-caisse" onclick="ouvrirDepuisRecherche('${r.conteneur.id}',${r.idx})">
        <div class="item">📦 ${r.parConteneur ? esc(r.caisse.nom) : surligner(r.caisse.nom, saisie)}
          ${approx ? '<span class="badge-approx">approchant</span>' : ''}</div>
        <div class="loc">
          <span class="chip" style="background:${r.conteneur.couleur}"><span class="dot"></span>${esc(r.conteneur.nom)}</span>
          <span class="caisse">${listeItems.length} éléments</span>
          ${tagValidation(r.caisse)}
        </div>
        <div class="apercu">${apercu}</div>
      </button>`;
    });
  }

  if(items.length){
    html += `<div class="section-titre">🔧 Matériels<span class="sous-titre-inline">${items.length}</span></div>`;
    items.slice(0,150).forEach(r=>{
      const approx = estApproximatif(saisie, r.item);
      html += `<button class="result" onclick="ouvrirDepuisRecherche('${r.conteneur.id}',${r.idx})">
        <div class="item">${surligner(r.item, saisie)}
          ${approx ? '<span class="badge-approx">approchant</span>' : ''}</div>
        <div class="loc">
          <span class="chip" style="background:${r.conteneur.couleur}"><span class="dot"></span>${esc(r.conteneur.nom)}</span>
          <span class="caisse">📦 ${esc(r.nomCaisse)}</span>
          ${tagValidation(r.caisse)}
        </div>
      </button>`;
    });
  }

  contenu.innerHTML = html;
}

/* ---------- Navigation ---------- */
function ouvrirConteneur(id){ vue={conteneurId:id, caisseIdx:null}; render(); window.scrollTo(0,0); }
function ouvrirCaisse(idx){ vue.caisseIdx=idx; render(); window.scrollTo(0,0); }
function retourAccueil(){ vue={conteneurId:null, caisseIdx:null}; render(); }
function retourConteneur(){ vue.caisseIdx=null; render(); }
function ouvrirDepuisRecherche(idCont, idxCaisse){
  searchInput.value=''; clearBtn.style.display='none';
  vue={ conteneurId:idCont, caisseIdx:idxCaisse };
  render(); window.scrollTo(0,0);
}

document.getElementById('backLink').addEventListener('click', function(e){
  if(searchInput.value){ e.preventDefault(); searchInput.value=''; clearBtn.style.display='none'; render(); return; }
  if(vue.caisseIdx!==null){ e.preventDefault(); retourConteneur(); return; }
  if(vue.conteneurId!==null){ e.preventDefault(); retourAccueil(); return; }

  /* Si on vient d'un colisage conteneur, le chevron y ramene directement */
  if(retourConteneurParam){
    e.preventDefault();
    location.href = "colisage-conteneur-saisie.html?conteneur=" +
      encodeURIComponent(retourConteneurParam);
  }
});
    </script>
  </body>
</html>
