<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saisie du colisage — PIGVS</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0B2C5C" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <style>
      .etapes { display: flex; gap: 6px; margin: 14px 0 16px; }
      .etapes .pas { flex: 1; height: 5px; border-radius: 3px; background: var(--border); }
      .etapes .pas.actif { background: var(--primary); }

      .bloc { background: #fff; border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 16px; margin-bottom: 14px; }
      .bloc > h2 { margin: 0 0 12px; font-size: 16px; color: var(--marine); }

      .btn-scan { display: flex; align-items: center; justify-content: center;
        gap: 12px; width: 100%; min-height: 58px; font-size: 17px; font-weight: 700;
        color: #fff; background: var(--primary); border: 0; border-radius: 12px; cursor: pointer; }
      .btn-scan:disabled { opacity: .5; cursor: not-allowed; }
      .ico-barcode-btn { width: 26px; height: 26px; fill: #fff; flex: 0 0 auto; }

      .separateur { display: flex; align-items: center; gap: 12px;
        margin: 16px 0 12px; color: var(--muted); font-size: 12px;
        text-transform: uppercase; letter-spacing: .8px; }
      .separateur::before, .separateur::after {
        content: ""; flex: 1; height: 1px; background: var(--border); }

      /* ---------- Retour au conteneur ---------- */
      .btn-retour-conteneur {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--marine, #0B2C5C);
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        padding: 11px 14px;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 12px;
      }
      .btn-retour-conteneur:active { opacity: .8; }

      /* ---------- Autocompletion ---------- */
      .ac-wrap { position: relative; }
      .ac-list { position: absolute; top: 100%; left: 0; right: 0;
        background: #fff; border: 1px solid #ccd4e0; border-radius: 10px;
        margin-top: 4px; max-height: 260px; overflow-y: auto;
        display: none; z-index: 800; box-shadow: var(--shadow-lg); }
      .ac-list div { padding: 12px 13px; font-size: 15px; cursor: pointer;
        border-bottom: 1px solid #f0f2f6; }
      .ac-list div:last-child { border-bottom: 0; }
      .ac-list div:hover { background: var(--primary-soft); }
      .ac-list .ac-empty { color: var(--muted); cursor: default; }
      .ac-list .ac-libre { background: #fff8e1; font-weight: 700; color: #8a6100; }
      .ac-list .ac-sous { display: block; font-size: 12px;
        color: var(--muted); margin-top: 2px; font-weight: 400; }
      .ac-list mark { background: #fff2a8; color: inherit;
        padding: 0 1px; border-radius: 3px; }

      /* ---------- Bandeau caisse ---------- */
      .bandeau-caisse { display: flex; align-items: center; gap: 12px;
        background: var(--primary-soft); border: 1px solid #cfe0f5;
        border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
      .bandeau-caisse .ico { font-size: 26px; }
      .bandeau-caisse .txt { flex: 1; min-width: 0; }
      .bandeau-caisse .nom { font-size: 16.5px; font-weight: 800; color: var(--marine); }
      .bandeau-caisse .sous { font-size: 12.5px; color: var(--muted); }
      .bandeau-caisse button { flex: 0 0 auto; background: #fff;
        border: 1px solid #cfe0f5; color: var(--primary); font-weight: 700;
        font-size: 13px; padding: 8px 12px; border-radius: 999px; cursor: pointer; }

      .maj-caisse { font-size: 12px; color: var(--muted);
        background: #f4f7fb; border: 1px solid var(--border);
        border-radius: 8px; padding: 7px 11px; margin-bottom: 12px; }

      .compteurs { display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 7px; margin-bottom: 12px; }
      .compteurs .kpi { background: #f4f7fb; border: 1px solid var(--border);
        border-radius: 10px; padding: 9px 4px; text-align: center; }
      .compteurs .val { display: block; font-size: 19px; font-weight: 800; color: var(--marine); }
      .compteurs .lab { display: block; font-size: 10px; text-transform: uppercase;
        letter-spacing: .5px; color: var(--muted); font-weight: 700; }
      .compteurs .kpi.ok .val { color: var(--vert); }
      .compteurs .kpi.ko .val { color: var(--rouge); }
      .compteurs .kpi.plus .val { color: var(--orange); }

      /* ---------- Ligne d'inventaire ---------- */
      .ligne-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        padding: 12px 0;
        border-bottom: 1px solid #eef0f3;
      }
      .ligne-item:last-of-type { border-bottom: 0; }

      .ligne-item .nom {
        flex: 1 1 100%;
        min-width: 0;
        font-size: 14.5px;
        line-height: 1.3;
        font-weight: 600;
      }
      .ligne-item.est-ko .nom { color: var(--muted); text-decoration: line-through; }
      .ligne-item.ajout .nom::before { content: "➕ "; }

      .ligne-item .zone-qte {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 auto;
      }
      .ligne-item .zone-qte label {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        white-space: nowrap;
        margin-right: 2px;
      }
      .ligne-item .zone-qte button {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        font-size: 19px;
        font-weight: 700;
        border: 1px solid #ccd4e0;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        line-height: 1;
      }
      .ligne-item .zone-qte button:active { background: var(--primary-soft); }

      .ligne-item .zone-qte input {
        width: 52px;
        height: 40px;
        flex: 0 0 auto;
        box-sizing: border-box;
        padding: 4px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        border: 1px solid #ccd4e0;
        border-radius: 10px;
        background: #fff;
      }
      .ligne-item .zone-qte input:focus {
        border-color: var(--primary);
        outline: 2px solid var(--primary-soft);
      }

      .ligne-item .btn-absent {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        font-size: 16px;
        font-weight: 700;
        border: 1px solid var(--rouge);
        border-radius: 10px;
        background: #fff;
        color: var(--rouge);
        cursor: pointer;
        margin-left: auto;
      }
      .ligne-item .btn-absent.actif {
        background: var(--rouge);
        color: #fff;
      }

      .ligne-item .btn-suppr {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        border-radius: 50%;
        border: 2px solid var(--rouge);
        background: #fff;
        color: var(--rouge);
        font-weight: 700;
        cursor: pointer;
      }

      .barre-rapide { display: flex; gap: 8px; margin-bottom: 12px; }
      .barre-rapide button { flex: 1; min-height: 44px; font-size: 13.5px;
        font-weight: 700; border-radius: 10px; border: 1px solid var(--border);
        background: #eef1f6; cursor: pointer; }

      .ajout-zone { display: flex; gap: 8px; margin-top: 12px; }
      .ajout-zone .ac-wrap { flex: 1; }
      .ajout-zone input { width: 100%; }
      .ajout-zone button { flex: 0 0 auto; padding: 0 18px; font-weight: 700;
        border-radius: 10px; border: 1px solid var(--primary);
        background: var(--primary-soft); color: var(--primary); cursor: pointer; }
      .aide-ajout { font-size: 12px; color: var(--muted); margin-top: 6px; }

      #camInput, #galInput { position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
      .btns-photo { display: flex; flex-direction: column; gap: 9px; }
      .btn-photo { display: flex; align-items: center; justify-content: center;
        gap: 8px; width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
        border: 0; border-radius: 12px; cursor: pointer;
        background: var(--primary); color: #fff; }
      .btn-photo.gal { background: #4b5563; }

      #galerie { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
      #galerie .ligne-photo { display: flex; align-items: center; gap: 10px;
        border: 1px solid #d0d7de; border-radius: 10px; padding: 8px; }
      #galerie img { width: 62px; height: 62px; object-fit: cover;
        border-radius: 8px; flex: 0 0 auto; }
      #galerie select { flex: 1; padding: 10px; font-size: 14.5px; }

      .compteur { font-size: 13.5px; color: var(--muted); text-align: center; margin-top: 10px; }
      .jauge { height: 8px; background: #e5e9ef; border-radius: 6px;
        overflow: hidden; margin-top: 8px; }
      .jauge > div { height: 100%; width: 0%; background: var(--vert);
        transition: width .2s, background .2s; }

      .chemin { font-size: 12px; font-family: monospace; color: #083f78;
        background: #eef4fb; border-radius: 8px; padding: 8px;
        margin-top: 10px; word-break: break-all; }

      .status { text-align: center; font-size: 15px; font-weight: 700;
        padding: 14px; border-radius: 12px; margin-top: 10px; display: none; }
      .status.info { display: block; background: #e7f0fb; color: #083f78; }
      .status.ok { display: block; background: #e4f6ec; color: var(--vert); }
      .status.erreur { display: block; background: #fdecec; color: var(--rouge); }

      .masque { display: none; }
    </style>

    <script src="pigvs-auth.js"></script>
    <script>
      PIGVS_AUTH.protegerPage();
    </script>
  </head>

  <body>
    <header class="app-header">
      <a class="back" href="colisage.html" id="backLink">‹</a>
      <h1>📝 Saisie du colisage</h1>
    </header>

    <div class="page">
      <div class="etapes">
        <div class="pas actif" id="pas1"></div>
        <div class="pas" id="pas2"></div>
        <div class="pas" id="pas3"></div>
      </div>

      <!-- ============ ETAPE 1 ============ -->
      <section class="bloc" id="blocChoix">
        <h2>1. Identifier la caisse</h2>

        <button type="button" class="btn-scan" id="btnScan">
          <svg class="ico-barcode-btn" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="4"  y="14" width="4"  height="36" rx="1" />
            <rect x="12" y="14" width="2"  height="36" rx="1" />
            <rect x="18" y="14" width="5"  height="36" rx="1" />
            <rect x="27" y="14" width="2"  height="36" rx="1" />
            <rect x="33" y="14" width="4"  height="36" rx="1" />
            <rect x="41" y="14" width="2"  height="36" rx="1" />
            <rect x="47" y="14" width="5"  height="36" rx="1" />
            <rect x="56" y="14" width="4"  height="36" rx="1" />
          </svg>
          <span>Scanner le code-barres</span>
        </button>

        <div class="separateur">ou</div>

        <div class="field-group">
          <label for="champCaisse">Rechercher une caisse</label>
          <div class="ac-wrap">
            <input
              type="text"
              id="champCaisse"
              placeholder="Ex : BOX 40, cart 3, cap4…"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
            <div class="ac-list" id="listeCaisses"></div>
          </div>
        </div>

        <div class="status" id="statusChoix"></div>
      </section>

      <!-- ============ ETAPE 2 ============ -->
      <section class="masque" id="blocInventaire">
        <div class="bandeau-caisse">
          <span class="ico">🧰</span>
          <div class="txt">
            <div class="nom" id="caisseNom">—</div>
            <div class="sous" id="caisseSous">—</div>
          </div>
          <button type="button" id="btnChanger">Changer</button>
        </div>

        <div class="maj-caisse" id="majCaisse" style="display: none"></div>

        <div class="bloc">
          <h2>2. Contenu réel de la caisse</h2>

          <div class="compteurs">
            <div class="kpi">
              <span class="val" id="kTotal">0</span>
              <span class="lab">Prévus</span>
            </div>
            <div class="kpi ok">
              <span class="val" id="kOk">0</span>
              <span class="lab">Présents</span>
            </div>
            <div class="kpi ko">
              <span class="val" id="kKo">0</span>
              <span class="lab">Manquants</span>
            </div>
            <div class="kpi plus">
              <span class="val" id="kPlus">0</span>
              <span class="lab">En plus</span>
            </div>
          </div>

          <div class="barre-rapide">
            <button type="button" id="btnToutPresent">✅ Tout présent</button>
            <button type="button" id="btnToutVider">↺ Réinitialiser</button>
          </div>

          <div id="listeItems"></div>

          <div class="ajout-zone">
            <div class="ac-wrap">
              <input
                type="text"
                id="champAjout"
                placeholder="Ajouter un élément trouvé en plus…"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <div class="ac-list" id="listeAjout"></div>
            </div>
            <button type="button" id="btnAjout">+</button>
          </div>
          <div class="aide-ajout">
            Choisissez dans la base matériel ou saisissez librement.
          </div>
        </div>

        <!-- ============ PHOTOS ============ -->
        <div class="bloc">
          <h2>3. Photos (facultatif)</h2>
          <input type="file" accept="image/*" capture="environment" id="camInput" />
          <input type="file" accept="image/*" multiple id="galInput" />
          <div class="btns-photo">
            <label for="camInput" class="btn-photo">📸 Prendre une photo</label>
            <label for="galInput" class="btn-photo gal">
              🖼️ Choisir dans la galerie
            </label>
          </div>
          <div id="galerie"></div>
          <div class="compteur" id="compteurPhotos"></div>
          <div class="jauge"><div id="jaugeFill"></div></div>
        </div>

        <!-- ============ ENVOI ============ -->
        <div class="bloc">
          <h2>4. Valider et envoyer</h2>

          <div class="field-group">
            <label for="operateur">Opérateur <span class="req">*</span></label>
            <input type="text" id="operateur" placeholder="Votre nom" />
          </div>

          <div class="field-group">
            <label for="commentaire">Commentaire</label>
            <textarea
              id="commentaire"
              placeholder="Observation, état de la caisse, anomalie…"
            ></textarea>
          </div>

          <div class="chemin" id="apercuChemin">Destination : …</div>

          <button class="btn" id="btnEnvoyer" style="margin-top: 12px">
            ✅ Envoyer le colisage 📤
          </button>

          <div class="status" id="statusEnvoi"></div>
        </div>
      </section>
    </div>

    <script src="pigvs-chantier.js"></script>
    <script src="pigvs-envoi.js"></script>
    <script src="pigvs-scan.js"></script>
    <script src="pigvs-colisage.js"></script>

    <script>
      const QUALITE_JPEG = 0.9;
      const MAX_LARGEUR = 2500;
      const LIMITE_TOTALE = 10 * 1024 * 1024;

      const TYPES_PHOTO = [
        { valeur: "exterieur", libelle: "Extérieur de la caisse" },
        { valeur: "interieur", libelle: "Intérieur de la caisse" },
        { valeur: "etiquette", libelle: "Étiquette / code-barres" },
        { valeur: "anomalie", libelle: "Anomalie constatée" },
      ];

      const C = window.PIGVS_COLISAGE;

      let COLISAGE = { conteneurs: [] };
      let CAISSES = [];
      let CODES = {};
      let CATALOGUE = [];

      let caisseActive = null;
      let items = [];
      let photos = [];

      /* =========================================================
         RETOUR AU CONTENEUR D'ORIGINE
         Permet d'enchainer le colisage des caisses d'un conteneur.
         ========================================================= */
      const retourConteneurParam =
        new URLSearchParams(location.search).get("retourConteneur");

      if (retourConteneurParam) {
        const bandeau = document.createElement("a");
        bandeau.className = "btn-retour-conteneur";
        bandeau.href =
          "colisage-conteneur-saisie.html?conteneur=" +
          encodeURIComponent(retourConteneurParam);
        bandeau.textContent =
          "← Retour au conteneur « " + retourConteneurParam + " »";

        const page = document.querySelector(".page");
        page.insertBefore(bandeau, page.firstChild);
      }

      /* =========================================================
         NORMALISATION PERMISSIVE
         ========================================================= */
      function norm(s) {
        return (s || "").toString().toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }
      function cleKey(s) { return norm(s).replace(/[^a-z0-9]/g, ""); }
      function eclater(s) {
        return norm(s).replace(/([a-z])(\d)/g, "$1 $2").replace(/(\d)([a-z])/g, "$1 $2");
      }
      function echapper(texte) {
        return (texte || "").toString()
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function attr(s) { return echapper(s).replace(/"/g, "&quot;"); }

      /* =========================================================
         MOTEUR DE RECHERCHE
         ========================================================= */
      function editDistance(a, b) {
        const dp = [];
        for (let i = 0; i <= a.length; i++) { dp[i] = []; dp[i][0] = i; }
        for (let j = 0; j <= b.length; j++) { dp[0][j] = j; }
        for (let i = 1; i <= a.length; i++) {
          for (let j = 1; j <= b.length; j++) {
            const c = a[i - 1] === b[j - 1] ? 0 : 1;
            dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + c);
            if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) {
              dp[i][j] = Math.min(dp[i][j], dp[i-2][j-2] + 1);
            }
          }
        }
        return dp[a.length][b.length];
      }
      function wordScore(s, t) {
        if (!s) return 1;
        if (t === s) return 120;
        if (t.startsWith(s)) return 100;
        if (t.includes(s)) return 80;
        const tp = t.substring(0, s.length);
        const d = Math.min(editDistance(s, t), editDistance(s, tp));
        let th = 0;
        if (s.length <= 3) th = 0;
        else if (s.length <= 5) th = 1;
        else if (s.length <= 9) th = 2;
        else th = 3;
        return d <= th ? 60 - d * 10 : 0;
      }
      function scoreMots(q, text) {
        const qw = q.split(/\s+/).filter(Boolean);
        const tw = text.split(/\s+/).filter(Boolean);
        if (!qw.length) return 1;
        let tot = 0;
        for (const w of qw) {
          let b = 0;
          for (const t of tw) { const sc = wordScore(w, t); if (sc > b) b = sc; }
          if (b === 0) return 0;
          tot += b;
        }
        if (text.startsWith(q)) tot += 50;
        if (text.includes(q)) tot += 30;
        return tot;
      }
      function itemScore(search, texte) {
        const q = norm(search);
        if (!q) return 1;
        const kq = cleKey(search);
        const kt = cleKey(texte);
        if (kq) {
          if (kt === kq) return 200;
          if (kt.startsWith(kq)) return 170;
          if (kt.includes(kq)) return 150;
        }
        const score = scoreMots(q, norm(texte));
        if (score > 0) return score;
        return scoreMots(eclater(search), eclater(texte));
      }
      function surligner(texte, search) {
        const mots = norm(search).split(/\s+/).filter(Boolean);
        const brut = norm(texte);
        const marques = new Array(texte.length).fill(false);
        mots.forEach(function (w) {
          let i = brut.indexOf(w);
          while (i >= 0) {
            for (let k = i; k < i + w.length && k < marques.length; k++) marques[k] = true;
            i = brut.indexOf(w, i + w.length);
          }
        });
        if (!marques.some(Boolean)) {
          const kq = cleKey(search);
          if (kq) {
            const map = [];
            let kt = "";
            for (let i = 0; i < texte.length; i++) {
              const c = norm(texte[i]).replace(/[^a-z0-9]/g, "");
              if (c) { kt += c; map.push(i); }
            }
            const pos = kt.indexOf(kq);
            if (pos >= 0) {
              for (let k = pos; k < pos + kq.length && k < map.length; k++) marques[map[k]] = true;
            }
          }
        }
        let out = "", ouvert = false;
        for (let i = 0; i < texte.length; i++) {
          if (marques[i] && !ouvert) { out += "<mark>"; ouvert = true; }
          if (!marques[i] && ouvert) { out += "</mark>"; ouvert = false; }
          out += echapper(texte[i]);
        }
        return out + (ouvert ? "</mark>" : "");
      }

      /* =========================================================
         CATALOGUE LOCAL DE SECOURS
         ========================================================= */
      function catalogueDepuisColisageEtSap(colisage, sap) {
        const vus = {};
        const liste = [];

        function ajouter(nom) {
          const texte = (nom || "").toString().trim();
          const k = cleKey(texte);
          if (!k || vus[k]) return;
          vus[k] = true;
          liste.push(texte);
        }

        (colisage && colisage.conteneurs || []).forEach(function (conteneur) {
          (conteneur.caisses || []).forEach(function (caisse) {
            (caisse.items || []).forEach(function (item) {
              if (item && typeof item === "object") {
                ajouter(item.equipement || item.nom || "");
              } else {
                ajouter(item);
              }
            });
          });
        });

        const codes = (sap && sap.codes) || {};
        Object.keys(codes).forEach(function (code) {
          const entree = codes[code];
          if (entree && entree.type === "equipement" && entree.cible) ajouter(entree.cible);
        });

        return liste.sort(function (a, b) {
          return a.localeCompare(b, "fr", { sensitivity: "base" });
        });
      }

      /* =========================================================
         OUTILS
         ========================================================= */
      function sanitizePath(s) {
        return (s || "").toString().trim().replace(/[\\\/:*?"<>|]/g, "-");
      }
      function versNomFichier(s) { return sanitizePath(s).replace(/\s+/g, "_"); }
      function setStatus(element, type, message) {
        element.className = "status " + type;
        element.innerHTML = message;
      }
      function cacherStatus(element) {
        element.className = "status";
        element.innerHTML = "";
      }

      /* =========================================================
         ETAPE 1 — CHOIX DE LA CAISSE (declare avant le chargement)
         ========================================================= */
      const champCaisse = document.getElementById("champCaisse");
      const listeCaisses = document.getElementById("listeCaisses");
      const statusChoix = document.getElementById("statusChoix");
      const champAjout = document.getElementById("champAjout");
      const listeAjout = document.getElementById("listeAjout");

      /* =========================================================
         CHARGEMENT DES REFERENTIELS
         ========================================================= */
      Promise.all([
        C.lireColisage().catch(function () { return { conteneurs: [] }; }),
        fetch("caisses.json", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .catch(function () { return []; }),
        fetch("codes-sap.json", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .catch(function () { return { codes: {} }; }),
      ]).then(function (resultats) {
        COLISAGE = resultats[0] || { conteneurs: [] };
        const listeBrute = resultats[1] || [];
        const sap = resultats[2] || { codes: {} };
        CODES = sap.codes || {};

        CATALOGUE = [];

        const vues = {};
        (COLISAGE.conteneurs || []).forEach(function (conteneur) {
          (conteneur.caisses || []).forEach(function (caisse) {
            const k = cleKey(caisse.nom);
            if (!vues[k]) {
              vues[k] = true;
              CAISSES.push({
                nom: caisse.nom,
                conteneur: conteneur.nom,
                nbItems: (caisse.items || []).length,
              });
            }
          });
        });

        listeBrute.forEach(function (nom) {
          const k = cleKey(nom);
          if (!vues[k]) {
            vues[k] = true;
            CAISSES.push({ nom: nom, conteneur: "", nbItems: null });
          }
        });

        /* Charge le catalogue sans bloquer la recherche de caisses. */
        if (typeof C.catalogueEquipements === "function") {
          C.catalogueEquipements(COLISAGE)
            .then(function (liste) {
              CATALOGUE = Array.isArray(liste) ? liste : [];
              console.log("PIGVS :", CAISSES.length, "caisses ;", CATALOGUE.length, "equipements");
              if (champAjout.value.trim()) suggestionsAjout(champAjout.value);
            })
            .catch(function (err) {
              console.warn("Catalogue equipements indisponible :", err);
              CATALOGUE = catalogueDepuisColisageEtSap(COLISAGE, sap);
              if (champAjout.value.trim()) suggestionsAjout(champAjout.value);
            });
        } else {
          CATALOGUE = catalogueDepuisColisageEtSap(COLISAGE, sap);
          if (champAjout.value.trim()) suggestionsAjout(champAjout.value);
        }

        const params = new URLSearchParams(location.search);
        const demandee = params.get("caisse");
        if (demandee) selectionnerCaisse(demandee);

        /* Si l'utilisateur a deja tape avant la fin du chargement,
           on relance la recherche maintenant que les donnees sont pretes. */
        if (champCaisse.value.trim()) {
          afficherSuggestions(champCaisse.value);
        }
      });

      if (window.PIGVS) {
        PIGVS.loadChantiers().then(majChemin);
      }

      champCaisse.addEventListener("focus", function () {
        afficherSuggestions(champCaisse.value);
      });
      champCaisse.addEventListener("input", function () {
        afficherSuggestions(champCaisse.value);
      });
      champCaisse.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const premiere = listeCaisses.querySelector("div[data-nom]");
        if (premiere) {
          listeCaisses.style.display = "none";
          selectionnerCaisse(premiere.dataset.nom);
        }
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".ac-wrap")) {
          listeCaisses.style.display = "none";
          listeAjout.style.display = "none";
        }
      });

      function afficherSuggestions(filtre) {
        const saisie = (filtre || "").trim();
        let resultats;

        if (!saisie) {
          resultats = CAISSES.slice(0, 80).map(function (c) {
            return { caisse: c, score: 1 };
          });
        } else {
          resultats = CAISSES.map(function (c) {
            return { caisse: c, score: itemScore(saisie, c.nom) };
          })
            .filter(function (r) { return r.score > 0; })
            .sort(function (a, b) {
              return b.score - a.score || a.caisse.nom.localeCompare(b.caisse.nom);
            })
            .slice(0, 80);
        }

        if (!resultats.length) {
          listeCaisses.innerHTML = "<div class='ac-empty'>Aucune caisse trouvée</div>";
        } else {
          listeCaisses.innerHTML = resultats.map(function (r) {
            const c = r.caisse;
            const libelle = saisie ? surligner(c.nom, saisie) : echapper(c.nom);
            const sous = c.conteneur
              ? "<span class='ac-sous'>" + echapper(c.conteneur) +
                (c.nbItems !== null ? " · " + c.nbItems + " élément(s)" : "") + "</span>"
              : "<span class='ac-sous'>Non référencée au colisage</span>";
            return '<div data-nom="' + attr(c.nom) + '">' + libelle + sous + "</div>";
          }).join("");

          listeCaisses.querySelectorAll("div[data-nom]").forEach(function (ligne) {
            ligne.addEventListener("mousedown", function (ev) {
              ev.preventDefault();
              listeCaisses.style.display = "none";
              selectionnerCaisse(ligne.dataset.nom);
            });
          });
        }
        listeCaisses.style.display = "block";
      }

      /* --- Scanner --- */
      const btnScan = document.getElementById("btnScan");

      if (typeof PIGVS_SCAN === "undefined") {
        btnScan.disabled = true;
        setStatus(statusChoix, "erreur",
          "❌ Module de scan non chargé. Vérifiez pigvs-scan.js.");
      } else if (!PIGVS_SCAN.disponible()) {
        btnScan.disabled = true;
        setStatus(statusChoix, "info",
          "ℹ️ Scan caméra indisponible ici. Utilisez la recherche ci-dessous.");
      }

      btnScan.addEventListener("click", function () {
        if (typeof PIGVS_SCAN === "undefined") return;
        PIGVS_SCAN.ouvrir(
          function (code) {
            let trouve = CODES[code];
            if (!trouve) {
              const k = Object.keys(CODES).find(function (x) {
                return cleKey(x) === cleKey(code);
              });
              if (k) trouve = CODES[k];
            }
            if (trouve && trouve.type === "caisse") {
              selectionnerCaisse(trouve.cible);
            } else if (trouve) {
              setStatus(statusChoix, "erreur",
                "⚠️ Ce code correspond à un " + echapper(trouve.type) + ", pas à une caisse.");
            } else {
              selectionnerCaisse(code);
            }
          },
          function (message) {
            setStatus(statusChoix, "erreur", "❌ " + echapper(message));
          }
        );
      });

      /* --- Selection --- */
      function trouverCaisse(nom) {
        const recherche = cleKey(nom);
        if (!recherche) return null;

        for (const conteneur of COLISAGE.conteneurs || []) {
          for (const caisse of conteneur.caisses || []) {
            if (cleKey(caisse.nom) === recherche) return { conteneur, caisse };
          }
        }
        for (const conteneur of COLISAGE.conteneurs || []) {
          for (const caisse of conteneur.caisses || []) {
            const k = cleKey(caisse.nom);
            if (k && (k.includes(recherche) || recherche.includes(k))) {
              return { conteneur, caisse };
            }
          }
        }
        return null;
      }

      function selectionnerCaisse(nom) {
        const resultat = trouverCaisse(nom);

        if (resultat) {
          caisseActive = resultat;
          items = (resultat.caisse.items || []).map(function (source) {
            const estObjet = source && typeof source === "object";
            const nomItem = estObjet
              ? (source.equipement || source.nom || "")
              : String(source || "");
            const quantitePrevue = estObjet
              ? Math.max(0, parseInt(source.quantite || 1, 10))
              : 1;
            return {
              nom: nomItem,
              quantitePrevue: quantitePrevue,
              quantitePresente: quantitePrevue,
              ajout: false
            };
          });
        } else {
          caisseActive = {
            conteneur: { nom: "—" },
            caisse: { nom: nom, items: [] },
          };
          items = [];
          setStatus(statusChoix, "info",
            "ℹ️ Caisse non répertoriée : saisissez son contenu manuellement.");
        }

        document.getElementById("caisseNom").textContent = caisseActive.caisse.nom;
        document.getElementById("caisseSous").textContent =
          "Conteneur : " + caisseActive.conteneur.nom;

        /* Derniere validation connue */
        const v = caisseActive.caisse.verif || caisseActive.caisse.derniereValidation;
        const zoneMaj = document.getElementById("majCaisse");
        if (v && v.date) {
          const dateAff = /^\d{4}-\d{2}-\d{2}/.test(v.date)
            ? new Date(v.date).toLocaleDateString("fr-FR")
            : v.date;
          zoneMaj.style.display = "block";
          zoneMaj.innerHTML = "🗓️ Dernier colisage validé le <b>" + echapper(dateAff) + "</b>" +
            (v.site ? " sur <b>" + echapper(v.site) + "</b>" : "") +
            (v.operateur ? " · relevé par " + echapper(v.operateur) : "");
        } else {
          zoneMaj.style.display = "block";
          zoneMaj.innerHTML = "🗓️ Aucun colisage validé pour cette caisse à ce jour.";
        }

        document.getElementById("blocChoix").classList.add("masque");
        document.getElementById("blocInventaire").classList.remove("masque");
        document.getElementById("pas2").classList.add("actif");

        rendreItems();
        majChemin();
        window.scrollTo(0, 0);
      }

      document.getElementById("btnChanger").addEventListener("click", function () {
        document.getElementById("blocInventaire").classList.add("masque");
        document.getElementById("blocChoix").classList.remove("masque");
        document.getElementById("pas2").classList.remove("actif");
        document.getElementById("pas3").classList.remove("actif");
        cacherStatus(statusChoix);
        champCaisse.value = "";
        window.scrollTo(0, 0);
      });

      /* =========================================================
         ETAPE 2 — INVENTAIRE
         La QUANTITE fait foi : quantite > 0 = present.
         ========================================================= */
      const listeItems = document.getElementById("listeItems");

      function rendreItems() {
        if (!items.length) {
          listeItems.innerHTML =
            "<p class='empty' style='padding:20px 0'>Aucun élément prévu.<br>Ajoutez le contenu constaté ci-dessous.</p>";
        } else {
          listeItems.innerHTML = items.map(function (item, index) {
            const absent = Number(item.quantitePresente || 0) === 0;
            const classe = (absent ? " est-ko" : "") + (item.ajout ? " ajout" : "");

            return (
              '<div class="ligne-item' + classe + '">' +
              '<span class="nom">' + echapper(item.nom) + "</span>" +
              '<div class="zone-qte">' +
                (item.ajout ? '' : '<label>Qté / ' + item.quantitePrevue + '</label>') +
                '<button type="button" data-moins="' + index + '" aria-label="Diminuer">−</button>' +
                '<input ' +
                  'type="number" ' +
                  'id="qte-' + index + '" ' +
                  'data-qte="' + index + '" ' +
                  'min="0" ' +
                  'step="1" ' +
                  'inputmode="numeric" ' +
                  'value="' + Math.max(0, parseInt(item.quantitePresente || 0, 10)) + '" ' +
                '/>' +
                '<button type="button" data-plus="' + index + '" aria-label="Augmenter">+</button>' +
              '</div>' +
              '<button type="button" class="btn-absent' + (absent ? ' actif' : '') +
                '" data-absent="' + index + '" title="Marquer absent">✕</button>' +
              (item.ajout
                ? '<button type="button" class="btn-suppr" data-suppr="' + index + '">×</button>'
                : "") +
              "</div>"
            );
          }).join("");

          listeItems.querySelectorAll("[data-qte]").forEach(function (champ) {
            champ.addEventListener("change", function () {
              const index = Number(champ.dataset.qte);
              let valeur = parseInt(champ.value, 10);
              if (isNaN(valeur) || valeur < 0) valeur = 0;
              items[index].quantitePresente = valeur;
              rendreItems();
            });
          });

          listeItems.querySelectorAll("[data-plus]").forEach(function (b) {
            b.addEventListener("click", function () {
              const index = Number(b.dataset.plus);
              items[index].quantitePresente = Number(items[index].quantitePresente || 0) + 1;
              rendreItems();
            });
          });

          listeItems.querySelectorAll("[data-moins]").forEach(function (b) {
            b.addEventListener("click", function () {
              const index = Number(b.dataset.moins);
              items[index].quantitePresente = Math.max(0, Number(items[index].quantitePresente || 0) - 1);
              rendreItems();
            });
          });

          listeItems.querySelectorAll("[data-absent]").forEach(function (b) {
            b.addEventListener("click", function () {
              const index = Number(b.dataset.absent);
              items[index].quantitePresente = 0;
              rendreItems();
            });
          });

          listeItems.querySelectorAll("[data-suppr]").forEach(function (b) {
            b.addEventListener("click", function () {
              items.splice(+b.dataset.suppr, 1);
              rendreItems();
            });
          });
        }
        majCompteurs();
      }

      function majCompteurs() {
        const prevus = items
          .filter(function (i) { return !i.ajout; })
          .reduce(function (total, item) {
            return total + Number(item.quantitePrevue || 0);
          }, 0);

        const presents = items
          .filter(function (i) { return !i.ajout; })
          .reduce(function (total, item) {
            return total + Number(item.quantitePresente || 0);
          }, 0);

        const manquants = items
          .filter(function (i) { return !i.ajout; })
          .reduce(function (total, item) {
            const prevue = Number(item.quantitePrevue || 0);
            const presente = Number(item.quantitePresente || 0);
            return total + Math.max(0, prevue - presente);
          }, 0);

        const ajoutes = items
          .filter(function (i) { return i.ajout; })
          .reduce(function (total, item) {
            return total + Number(item.quantitePresente || 0);
          }, 0);

        document.getElementById("kTotal").textContent = prevus;
        document.getElementById("kOk").textContent = presents;
        document.getElementById("kKo").textContent = manquants;
        document.getElementById("kPlus").textContent = ajoutes;
      }

      document.getElementById("btnToutPresent")
        .addEventListener("click", function () {
          items.forEach(function (item) {
            if (!item.ajout) item.quantitePresente = item.quantitePrevue;
          });
          rendreItems();
        });

      document.getElementById("btnToutVider")
        .addEventListener("click", function () {
          items = items.filter(function (item) { return !item.ajout; });
          items.forEach(function (item) { item.quantitePresente = item.quantitePrevue; });
          rendreItems();
        });

      /* =========================================================
         AJOUT D'UN ELEMENT
         Autocompletion sur la base materiel + saisie libre
         ========================================================= */
      champAjout.addEventListener("focus", function () {
        suggestionsAjout(champAjout.value);
      });
      champAjout.addEventListener("input", function () {
        suggestionsAjout(champAjout.value);
      });
      champAjout.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const premiere = listeAjout.querySelector("div[data-item]");
        if (premiere && listeAjout.style.display === "block") {
          ajouterItem(premiere.dataset.item);
        } else {
          ajouterItem(champAjout.value);
        }
      });

      function suggestionsAjout(filtre) {
        const saisie = (filtre || "").trim();

        if (!saisie) {
          listeAjout.innerHTML =
            "<div class='ac-empty'>Commencez à taper pour rechercher dans la base matériel…</div>";
          listeAjout.style.display = "block";
          return;
        }

        const resultats = CATALOGUE
          .map(function (nom) { return { nom: nom, score: itemScore(saisie, nom) }; })
          .filter(function (r) { return r.score > 0; })
          .sort(function (a, b) {
            return b.score - a.score || a.nom.localeCompare(b.nom);
          })
          .slice(0, 40);

        let html =
          '<div class="ac-libre" data-item="' + attr(saisie) + '">' +
          "➕ Ajouter « " + echapper(saisie) + " »" +
          "<span class='ac-sous'>Saisie libre</span></div>";

        if (resultats.length) {
          html += resultats.map(function (r) {
            return '<div data-item="' + attr(r.nom) + '">' +
              surligner(r.nom, saisie) +
              "<span class='ac-sous'>Base matériel</span></div>";
          }).join("");
        } else {
          html += "<div class='ac-empty'>Aucune correspondance dans la base matériel</div>";
        }

        listeAjout.innerHTML = html;

        listeAjout.querySelectorAll("div[data-item]").forEach(function (ligne) {
          ligne.addEventListener("mousedown", function (ev) {
            ev.preventDefault();
            ajouterItem(ligne.dataset.item);
          });
        });
        listeAjout.style.display = "block";
      }

      function ajouterItem(valeur) {
        const nom = (valeur || "").trim();
        if (!nom) return;

        const deja = items.some(function (i) { return cleKey(i.nom) === cleKey(nom); });
        if (deja) {
          setStatus(statusEnvoi, "erreur", "⚠️ « " + echapper(nom) + " » est déjà dans la liste.");
          champAjout.value = "";
          listeAjout.style.display = "none";
          return;
        }

        items.push({
          nom: nom,
          quantitePrevue: 0,
          quantitePresente: 1,
          ajout: true
        });

        champAjout.value = "";
        listeAjout.style.display = "none";
        cacherStatus(statusEnvoi);
        rendreItems();
      }

      document.getElementById("btnAjout").addEventListener("click", function () {
        ajouterItem(champAjout.value);
      });

      /* =========================================================
         PHOTOS
         ========================================================= */
      const camInput = document.getElementById("camInput");
      const galInput = document.getElementById("galInput");
      const galerie = document.getElementById("galerie");
      const compteurPhotos = document.getElementById("compteurPhotos");
      const jaugeFill = document.getElementById("jaugeFill");
      const statusEnvoi = document.getElementById("statusEnvoi");

      function tailleTotale() {
        return photos.reduce(function (s, p) { return s + p.file.size; }, 0);
      }
      function fmtMo(o) { return (o / 1048576).toFixed(1); }

      function compresser(fichier) {
        return new Promise(function (resolve, reject) {
          const lecteur = new FileReader();
          lecteur.onerror = function () { reject("lecture impossible"); };
          lecteur.onload = function (ev) {
            const img = new Image();
            img.onerror = function () { reject("image invalide"); };
            img.onload = function () {
              const ratio = Math.min(1, MAX_LARGEUR / Math.max(img.width, img.height));
              const canvas = document.createElement("canvas");
              canvas.width = Math.round(img.width * ratio);
              canvas.height = Math.round(img.height * ratio);
              canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
              canvas.toBlob(function (blob) {
                blob ? resolve(blob) : reject("compression échouée");
              }, "image/jpeg", QUALITE_JPEG);
            };
            img.src = ev.target.result;
          };
          lecteur.readAsDataURL(fichier);
        });
      }

      async function traiterFichiers(fichiers) {
        if (!fichiers.length) return;
        setStatus(statusEnvoi, "info", "⏳ Compression en cours…");

        let ajoutees = 0, refusees = 0;

        for (const fichier of fichiers) {
          let blob;
          try { blob = await compresser(fichier); }
          catch (err) { refusees++; continue; }

          if (tailleTotale() + blob.size > LIMITE_TOTALE) { refusees++; continue; }

          const file = new File([blob], "tmp_" + Date.now() + ".jpg", { type: "image/jpeg" });
          photos.push({
            file: file,
            url: URL.createObjectURL(file),
            type: photos.length === 0 ? "exterieur" : "interieur",
          });
          ajoutees++;
        }

        rendreGalerie();

        if (refusees > 0) {
          setStatus(statusEnvoi, "erreur",
            "⚠️ " + ajoutees + " ajoutée(s), " + refusees + " refusée(s) : limite de 10 Mo.");
        } else {
          setStatus(statusEnvoi, "info", "✅ " + ajoutees + " photo(s) ajoutée(s).");
        }
      }

      camInput.addEventListener("change", async function (e) {
        const f = Array.from(e.target.files || []);
        camInput.value = "";
        await traiterFichiers(f);
      });
      galInput.addEventListener("change", async function (e) {
        const f = Array.from(e.target.files || []);
        galInput.value = "";
        await traiterFichiers(f);
      });

      function rendreGalerie() {
        galerie.innerHTML = photos.map(function (photo, index) {
          const options = TYPES_PHOTO.map(function (t) {
            return '<option value="' + t.valeur + '" ' +
              (photo.type === t.valeur ? "selected" : "") + ">" + t.libelle + "</option>";
          }).join("");
          return '<div class="ligne-photo"><img src="' + photo.url +
            '" alt="" /><select data-type="' + index + '">' + options +
            '</select><button type="button" class="btn-suppr" data-photo="' +
            index + '">×</button></div>';
        }).join("");

        galerie.querySelectorAll("[data-type]").forEach(function (select) {
          select.addEventListener("change", function () {
            photos[+select.dataset.type].type = select.value;
          });
        });
        galerie.querySelectorAll("[data-photo]").forEach(function (b) {
          b.addEventListener("click", function () {
            const i = +b.dataset.photo;
            URL.revokeObjectURL(photos[i].url);
            photos.splice(i, 1);
            rendreGalerie();
          });
        });

        const total = tailleTotale();
        const pourcent = Math.min(100, Math.round((total / LIMITE_TOTALE) * 100));
        compteurPhotos.textContent = photos.length
          ? photos.length + " photo(s) · " + fmtMo(total) + " / 10 Mo" : "";
        jaugeFill.style.width = pourcent + "%";
        jaugeFill.style.background =
          pourcent >= 90 ? "#dc2626" : pourcent >= 70 ? "#f59e0b" : "#16a34a";
      }

      /* =========================================================
         ENVOI
         ========================================================= */
      function siteCourant() {
        const chantier = window.PIGVS ? PIGVS.getChantier() : null;
        if (!chantier || !chantier.site) {
          return "";
        }
        return chantier.site.trim();
      }

      function cheminDestination() {
        const site = siteCourant();
        if (!site) {
          return "chantier-non-selectionne";
        }
        if (!caisseActive) {
          return "…";
        }
        return (
          "colisage/" +
          sanitizePath(site) +
          "/" +
          sanitizePath(caisseActive.caisse.nom)
        );
      }

      function majChemin() {
        document.getElementById("apercuChemin").textContent =
          "Destination : /" + cheminDestination();
      }

      document.getElementById("btnEnvoyer").addEventListener("click", async function () {
        const operateur = document.getElementById("operateur").value.trim();
        const commentaire = document.getElementById("commentaire").value.trim();

        const site = siteCourant();
        if (!site) {
          setStatus(
            statusEnvoi,
            "erreur",
            "⚠️ Aucun chantier sélectionné. Revenez à l'accueil et choisissez un chantier avant d'envoyer le colisage."
          );
          return;
        }

        if (!caisseActive) {
          setStatus(statusEnvoi, "erreur", "⚠️ Sélectionnez d'abord une caisse.");
          return;
        }
        if (!operateur) {
          setStatus(statusEnvoi, "erreur", "⚠️ Renseignez le nom de l'opérateur.");
          return;
        }

        const bouton = this;
        bouton.disabled = true;
        setStatus(statusEnvoi, "info", "⏳ Envoi en cours…");

        const base = versNomFichier(caisseActive.caisse.nom);
        const compteurs = {};
        const listePhotos = photos.map(function (photo) {
          const cle = photo.type;
          compteurs[cle] = (compteurs[cle] || 0) + 1;
          return {
            file: photo.file,
            nom: base + "_" + cle + "_" + compteurs[cle] + ".jpg",
          };
        });

        const presentsJson = items
          .filter(function (item) {
            return !item.ajout && item.quantitePresente > 0;
          })
          .map(function (item) {
            return {
              equipement: item.nom,
              quantitePrevue: item.quantitePrevue,
              quantitePresente: item.quantitePresente
            };
          });

        const manquantsJson = items
          .filter(function (item) {
            return !item.ajout && item.quantitePresente < item.quantitePrevue;
          })
          .map(function (item) {
            return {
              equipement: item.nom,
              quantitePrevue: item.quantitePrevue,
              quantitePresente: item.quantitePresente,
              quantiteManquante: item.quantitePrevue - item.quantitePresente
            };
          });

        const ajoutesJson = items
          .filter(function (item) {
            return item.ajout && item.quantitePresente > 0;
          })
          .map(function (item) {
            return {
              equipement: item.nom,
              quantitePresente: item.quantitePresente
            };
          });

        const resultat = await PIGVS_ENVOI.envoyer({
          type: "COLISAGE",
          path: cheminDestination(),
          champs: {
            NiveauColisage: "caisse",

            Site: site,
            Conteneur: caisseActive.conteneur.nom,
            Caisse: caisseActive.caisse.nom,
            Operateur: operateur,
            Date: new Date().toLocaleString("fr-FR"),

            NbPrevus: String(
              items
                .filter(function (i) { return !i.ajout; })
                .reduce(function (total, item) {
                  return total + Number(item.quantitePrevue || 0);
                }, 0)
            ),
            NbPresents: String(
              presentsJson.reduce(function (total, item) {
                return total + Number(item.quantitePresente || 0);
              }, 0)
            ),
            NbManquants: String(
              manquantsJson.reduce(function (total, item) {
                return total + Number(item.quantiteManquante || 0);
              }, 0)
            ),
            NbAjoutes: String(
              ajoutesJson.reduce(function (total, item) {
                return total + Number(item.quantitePresente || 0);
              }, 0)
            ),

            Presents: JSON.stringify(presentsJson),
            Manquants: JSON.stringify(manquantsJson),
            Ajoutes: JSON.stringify(ajoutesJson),

            Commentaire: commentaire,
            NbPhotos: String(photos.length),
          },
          photos: listePhotos,
        });

        if (resultat.ok) {
          setStatus(statusEnvoi, "ok",
            "✅ Colisage de « " + echapper(caisseActive.caisse.nom) + " » envoyé !" +
            (retourConteneurParam
              ? "<br><span style='font-weight:400;font-size:13px'>Utilisez le bandeau en haut pour revenir au conteneur.</span>"
              : ""));
          document.getElementById("pas3").classList.add("actif");
          photos.forEach(function (p) { URL.revokeObjectURL(p.url); });
          photos = [];
          rendreGalerie();
          setTimeout(function () { bouton.disabled = false; }, 2000);
        } else {
          setStatus(statusEnvoi, "erreur", "❌ " + echapper(resultat.msg));
          bouton.disabled = false;
        }
      });

      /* Le chevron de retour ramene au conteneur si on en vient */
      document.getElementById("backLink").addEventListener("click", function (e) {
        if (retourConteneurParam) {
          e.preventDefault();
          location.href = "colisage-conteneur-saisie.html?conteneur=" +
            encodeURIComponent(retourConteneurParam);
        }
      });
    </script>
  </body>
</html>
