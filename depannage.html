<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistance Dépannage — PIGVS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B2C5C">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* Fil d'Ariane des étapes parcourues */
    .parcours{ margin:14px 0 4px; }
    .parcours .ligne{
      display:flex; gap:10px; align-items:flex-start;
      font-size:13px; color:var(--muted); padding:6px 0;
      border-left:2px solid var(--border); padding-left:12px; margin-left:6px;
    }
    .parcours .ligne b{ color:var(--marine); font-weight:700; }
    .parcours .rep{
      background:var(--primary-soft); color:var(--primary);
      border-radius:999px; padding:1px 9px; font-size:12px; font-weight:700;
      white-space:nowrap;
    }

    /* Carte de l'étape courante */
    .etape{
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--radius); box-shadow:var(--shadow-lg);
      padding:18px 16px; margin-bottom:14px;
      border-top:5px solid var(--acc,var(--primary));
    }
    .etape .type{
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:800; letter-spacing:.8px;
      text-transform:uppercase; color:var(--acc,var(--primary));
      margin-bottom:8px;
    }
    .etape h2{ margin:0 0 6px; font-size:19px; font-weight:800; color:var(--marine); line-height:1.3; }
    .etape .aide{
      margin:10px 0 0; font-size:13.5px; color:var(--muted);
      background:#f6f8fb; border-radius:10px; padding:10px 12px;
    }

    .choix{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
    .choix button{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      width:100%; min-height:54px; padding:14px 16px;
      font-size:16px; font-weight:700; text-align:left;
      border:1px solid #ccd4e0; border-radius:12px;
      background:#fff; color:var(--text); cursor:pointer;
    }
    .choix button:active{ background:var(--primary-soft); border-color:var(--primary); }
    .choix button .fl{ color:var(--primary); font-size:18px; }

    /* Étape « action » : bouton de validation */
    .btn-fait{ background:var(--primary); color:#fff; border:none;
      justify-content:center; box-shadow:0 2px 8px rgba(0,120,215,.25); }
    .btn-fait .fl{ color:#fff; }

    /* Étape finale */
    .etape.fin{ --acc:var(--vert); text-align:center; }
    .etape.fin .grand-ico{ font-size:52px; display:block; margin-bottom:6px; }

    .barre-actions{ display:flex; gap:10px; margin-top:6px; }
    .barre-actions button{
      flex:1; min-height:48px; padding:12px; font-size:14.5px; font-weight:700;
      border-radius:12px; cursor:pointer;
      background:#eef1f6; color:var(--text); border:1px solid var(--border);
    }
    .barre-actions button:active{ background:#e2e7ef; }

    /* Rappel de la lance sélectionnée */
    .contexte{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      margin-bottom:12px;
    }
    .contexte .chip{ background:#fff8e1; border-color:#ffe0a3; color:#8a6100; }
  </style>
<script src="pigvs-auth.js"></script>
<script>PIGVS_AUTH.protegerPage();</script>
</head>
<body>
  <header class="app-header">
    <a class="back" href="index.html" id="lienRetour">‹</a>
    <h1 id="titrePage">🛟 Assistance Dépannage</h1>
  </header>

  <div class="page">
    <div id="vue"></div>
  </div>

<script>
const vue = document.getElementById('vue');
const titrePage = document.getElementById('titrePage');

let DATA = { pannes: [] };
let panne = null;        // panne sélectionnée
let vars  = {};          // { LANCE:"Lance 1", AUTRE:"Lance 2" }
let etapeId = null;      // étape courante
let parcours = [];       // historique : [{id, texte, reponse}]

/* ---------- Chargement ---------- */
fetch('depannage-data.json')
  .then(r => r.json())
  .then(d => { DATA = d; afficherMenu(); })
  .catch(() => {
    vue.innerHTML = "<div class='empty'>⚠️ Impossible de charger depannage-data.json</div>";
  });

/* ---------- Substitution {LANCE} / {AUTRE} ---------- */
function subst(txt){
  if(!txt) return '';
  return txt.replace(/\{(\w+)\}/g, (m, cle) => vars[cle] !== undefined ? vars[cle] : m);
}

/* ---------- 1. Menu des pannes ---------- */
function afficherMenu(){
  titrePage.textContent = '🛟 Assistance Dépannage';
  document.getElementById('lienRetour').setAttribute('href','index.html');
  panne = null; vars = {}; parcours = []; etapeId = null;

  let html = "<p class='sous-titre'>Quel type de panne rencontrez-vous ?</p>";
  html += "<section class='grille-modules'>";
  DATA.pannes.forEach(p => {
    html += `<a class="module ${p.couleur||'bleu'}" href="#" data-panne="${p.id}">
      <div class="module-head">
        <span class="module-ico">${p.ico||'🔧'}</span>
        <div>
          <h2>${p.titre}</h2>
          <p>${p.sousTitre||''}</p>
        </div>
      </div>
      <div class="module-foot">
        <span class="tags">Guidage pas à pas</span>
        <span class="fleche">→</span>
      </div>
    </a>`;
  });
  html += "</section>";
  vue.innerHTML = html;

  vue.querySelectorAll('[data-panne]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      demarrer(a.dataset.panne);
    });
  });
}

/* ---------- 2. Questions préalables (choix de la lance) ---------- */
function demarrer(id){
  panne = DATA.pannes.find(p => p.id === id);
  if(!panne) return;
  vars = {}; parcours = [];
  titrePage.textContent = (panne.ico||'🔧') + ' ' + panne.titre;
  poserVariable(0);
}

function poserVariable(i){
  const liste = panne.variables || [];
  if(i >= liste.length){ etapeId = panne.depart; afficherEtape(); return; }

  const v = liste[i];
  let html = `<div class="etape" style="--acc:var(--orange)">
      <span class="type">⚙️ Préalable</span>
      <h2>${v.question}</h2>
      <div class="choix">`;
  v.options.forEach((o, idx) => {
    html += `<button data-opt="${idx}">${o.label}<span class="fl">›</span></button>`;
  });
  html += `</div></div>
    <div class="barre-actions"><button id="bRetourMenu">← Changer de panne</button></div>`;
  vue.innerHTML = html;

  vue.querySelectorAll('[data-opt]').forEach(b => {
    b.addEventListener('click', () => {
      const o = v.options[+b.dataset.opt];
      vars[v.id]  = o.valeur;
      vars.AUTRE  = o.oppose;          /* « l'autre lance » */
      poserVariable(i+1);
    });
  });
  document.getElementById('bRetourMenu').addEventListener('click', afficherMenu);
}

/* ---------- 3. Déroulement des étapes ---------- */
function afficherEtape(){
  const e = panne.etapes[etapeId];
  if(!e){ vue.innerHTML = "<div class='empty'>⚠️ Étape introuvable : "+etapeId+"</div>"; return; }

  let html = '';

  /* Rappel du contexte */
  if(vars.LANCE){
    html += `<div class="contexte"><span class="chip">⚡ Défaut sur ${vars.LANCE}</span></div>`;
  }

  /* Historique */
  if(parcours.length){
    html += "<div class='parcours'>";
    parcours.forEach(p => {
      html += `<div class="ligne"><b>${p.texte}</b>${p.reponse ? `<span class="rep">${p.reponse}</span>` : ''}</div>`;
    });
    html += "</div>";
  }

  /* Étape courante */
  if(e.type === 'question'){
    html += `<div class="etape" style="--acc:var(--primary)">
        <span class="type">❓ Question</span>
        <h2>${subst(e.texte)}</h2>
        ${e.aide ? `<p class="aide">💡 ${subst(e.aide)}</p>` : ''}
        <div class="choix">`;
    e.choix.forEach((c, i) => {
      html += `<button data-choix="${i}">${subst(c.label)}<span class="fl">›</span></button>`;
    });
    html += `</div></div>`;
  }
  else if(e.type === 'action'){
    html += `<div class="etape" style="--acc:var(--vert)">
        <span class="type">🔧 Action à réaliser</span>
        <h2>${subst(e.texte)}</h2>
        ${e.aide ? `<p class="aide">💡 ${subst(e.aide)}</p>` : ''}
        <div class="choix">
          <button class="btn-fait" data-suite="1">✓ C'est fait<span class="fl">›</span></button>
        </div></div>`;
  }
  else { /* fin */
    html += `<div class="etape fin">
        <span class="grand-ico">✅</span>
        <h2>${subst(e.texte)}</h2>
        ${e.aide ? `<p class="aide">${subst(e.aide)}</p>` : ''}
        <div class="choix" style="margin-top:14px">
          <a class="btn" href="fdm.html">📋 Ouvrir une fiche de maintenance</a>
        </div></div>`;
  }

  /* Barre d'actions */
  html += `<div class="barre-actions">
      ${parcours.length ? '<button id="bPrec">← Étape précédente</button>' : ''}
      <button id="bRecommencer">↻ Recommencer</button>
      <button id="bMenu">Changer de panne</button>
    </div>`;

  vue.innerHTML = html;
  window.scrollTo(0,0);

  /* Écouteurs */
  vue.querySelectorAll('[data-choix]').forEach(b => {
    b.addEventListener('click', () => {
      const c = e.choix[+b.dataset.choix];
      parcours.push({ id:etapeId, texte:subst(e.texte), reponse:subst(c.label) });
      etapeId = c.vers;
      afficherEtape();
    });
  });
  const bs = vue.querySelector('[data-suite]');
  if(bs) bs.addEventListener('click', () => {
    parcours.push({ id:etapeId, texte:subst(e.texte), reponse:'Fait' });
    etapeId = e.vers;
    afficherEtape();
  });

  const bp = document.getElementById('bPrec');
  if(bp) bp.addEventListener('click', () => {
    const p = parcours.pop();
    etapeId = p.id;
    afficherEtape();
  });
  document.getElementById('bRecommencer').addEventListener('click', () => {
    parcours = []; etapeId = panne.depart; afficherEtape();
  });
  document.getElementById('bMenu').addEventListener('click', afficherMenu);
}
</script>
</body>
</html>
