<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assistance Dépannage — PIGVS</title><link rel="stylesheet" href="style.css">
<style>
.dep-page{max-width:980px;margin:auto;padding:14px}.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.crumb{border:0;background:#e8f1fb;color:#0B2C5C;border-radius:999px;padding:7px 11px;font-weight:700}.indispo{opacity:.47;filter:grayscale(.4);pointer-events:none}.indispo::before{content:"Bientôt";position:absolute;right:8px;top:8px;background:#64748b;color:white;border-radius:999px;padding:3px 7px;font-size:10px;z-index:2}.etape{background:#fff;border:1px solid #dfe5ee;border-top:5px solid var(--acc,#0078D7);border-radius:14px;padding:18px 16px;box-shadow:0 8px 24px rgba(11,44,92,.14);margin-bottom:14px}.etape h2{color:#0B2C5C;margin:0 0 7px;font-size:19px}.type{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--acc,#0078D7)}.aide{background:#f6f8fb;border-radius:10px;padding:10px 12px;color:#657085;font-size:13.5px}.choix{display:flex;flex-direction:column;gap:9px;margin-top:15px}.choix button{min-height:52px;background:white;border:1px solid #ccd4e0;border-radius:12px;padding:13px 15px;text-align:left;font-weight:700;font-size:15.5px}.img-etape{display:block;width:100%;max-height:320px;object-fit:contain;margin:12px 0;border-radius:10px;border:1px solid #e4e8ee;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;padding:11px;border:1px solid #dfe5ee;border-radius:10px;background:#eef1f6;font-weight:700;min-width:135px}.parcours{font-size:12px;color:#657085;margin-bottom:10px}.parcours span{display:inline-block;margin:2px 4px 2px 0;background:#eef4fb;padding:4px 7px;border-radius:7px}
</style>
<script src="pigvs-auth.js"></script><script>PIGVS_AUTH.protegerPage();</script></head>
<body><header class="app-header"><a class="back" href="index.html">‹</a><h1 id="titre">🛟 Assistance Dépannage</h1></header>
<main class="dep-page"><div class="crumbs" id="crumbs"></div><div id="vue"></div></main>
<script>
let DATA={pannes:[]}, NAV={activites:[]}, activite=null, systeme=null, panne=null, vars={}, parcours=[], etapeId=null;
const vue=document.getElementById('vue'), crumbs=document.getElementById('crumbs');
Promise.all([fetch('depannage-data.json').then(r=>r.json()),fetch('depannage-navigation.json').then(r=>r.json())]).then(([d,n])=>{DATA=d;NAV=n;menuActivites()}).catch(e=>vue.innerHTML='<div class="empty">⚠️ Données de dépannage indisponibles</div>');
function subst(t){return (t||'').replace(/\{(\w+)\}/g,(m,k)=>vars[k]??m)}
function nav(){let h='<button class="crumb" data-home>Assistance</button>';if(activite)h+=`<button class="crumb" data-act>${activite.titre}</button>`;if(systeme)h+=`<button class="crumb" data-sys>${systeme.titre}</button>`;crumbs.innerHTML=h;let b=crumbs.querySelector('[data-home]');if(b)b.onclick=menuActivites;b=crumbs.querySelector('[data-act]');if(b)b.onclick=()=>menuSystemes(activite.id);b=crumbs.querySelector('[data-sys]');if(b)b.onclick=()=>menuPannes(activite.id,systeme.id)}
function cards(items,kind){vue.innerHTML='<p class="sous-titre">'+(kind==='act'?'Choisissez l’activité':kind==='sys'?'Choisissez le système':'Quel défaut rencontrez-vous ?')+'</p><section class="grille-modules">'+items.map(x=>`<a href="#" class="module ${x.couleur||'bleu'} ${x.disponible===false?'indispo':''}" data-id="${x.id}"><div class="module-head"><span class="module-ico">${x.ico||'🔧'}</span><div><h2>${x.titre}</h2><p>${x.sousTitre||''}</p></div></div><div class="module-foot"><span class="tags">${x.disponible===false?'Assistance à venir':'Guidage pas à pas'}</span><span class="fleche">→</span></div></a>`).join('')+'</section>';vue.querySelectorAll('[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();if(kind==='act')menuSystemes(a.dataset.id);else if(kind==='sys')menuPannes(activite.id,a.dataset.id);else demarrer(a.dataset.id)})}
function menuActivites(){activite=systeme=panne=null;nav();cards(NAV.activites,'act')}
function menuSystemes(id){activite=NAV.activites.find(x=>x.id===id);systeme=panne=null;nav();cards(activite.systemes,'sys')}
function menuPannes(aid,sid){activite=NAV.activites.find(x=>x.id===aid);systeme=activite.systemes.find(x=>x.id===sid);panne=null;nav();let ps=(systeme.pannes||[]).map(id=>DATA.pannes.find(p=>p.id===id)).filter(Boolean);cards(ps,'panne')}
function demarrer(id){panne=DATA.pannes.find(x=>x.id===id);vars={};parcours=[];nav();poserVar(0)}
function poserVar(i){let l=panne.variables||[];if(i>=l.length){etapeId=panne.depart;afficherEtape();return}let v=l[i];vue.innerHTML=`<div class="etape"><span class="type">Préalable</span><h2>${v.question}</h2><div class="choix">${v.options.map((o,j)=>`<button data-o="${j}">${o.label}</button>`).join('')}</div></div>`;vue.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{let o=v.options[+b.dataset.o];vars[v.id]=o.valeur;if(o.oppose)vars.AUTRE=o.oppose;poserVar(i+1)})}
function afficherEtape(){let e=panne.etapes[etapeId];if(!e){vue.innerHTML='<div class="empty">Étape introuvable</div>';return}let hist=parcours.length?'<div class="parcours">'+parcours.map(p=>`<span>${p.r}</span>`).join('')+'</div>':'';let img=e.image?`<img class="img-etape" src="${e.image}" alt="Illustration de l’étape">`:'';let body;if(e.type==='question')body=`<div class="choix">${e.choix.map((c,i)=>`<button data-c="${i}">${subst(c.label)}</button>`).join('')}</div>`;else if(e.type==='action')body='<div class="choix"><button data-next>✓ C’est fait</button></div>';else body='<div class="choix"><a class="btn" href="fdm.html">📋 Ouvrir une FDM</a></div>';vue.innerHTML=hist+`<div class="etape ${e.type==='fin'?'fin':''}" style="--acc:${e.type==='fin'?'#16a34a':e.type==='action'?'#16a34a':'#0078D7'}"><span class="type">${e.type==='question'?'❓ Question':e.type==='action'?'🔧 Action':'✅ Fin'}</span><h2>${subst(e.texte)}</h2>${e.aide?`<div class="aide">${subst(e.aide)}</div>`:''}${img}${body}</div><div class="actions">${parcours.length?'<button data-back>← Précédent</button>':''}<button data-restart>↻ Recommencer</button><button data-system>Changer de système</button></div>`;vue.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let c=e.choix[+b.dataset.c];parcours.push({id:etapeId,r:subst(c.label)});etapeId=c.vers;afficherEtape()});let n=vue.querySelector('[data-next]');if(n)n.onclick=()=>{parcours.push({id:etapeId,r:'Fait'});etapeId=e.vers;afficherEtape()};let bk=vue.querySelector('[data-back]');if(bk)bk.onclick=()=>{let p=parcours.pop();etapeId=p.id;afficherEtape()};vue.querySelector('[data-restart]').onclick=()=>{parcours=[];etapeId=panne.depart;afficherEtape()};vue.querySelector('[data-system]').onclick=()=>menuSystemes(activite.id);window.scrollTo(0,0)}
</script></body></html>
